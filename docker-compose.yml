services:
  postgres:
    image: postgres:16
    container_name: publications-postgres
    environment:
      POSTGRES_DB: publications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - publications_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: publications-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  publications_postgres_data: